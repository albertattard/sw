name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release --verbose

      - name: Test release formula generation
        run: bash tests/render-homebrew-formula.sh

      - name: Prepare CI artifact
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          mkdir -p dist
          cp target/release/sw dist/sw
          cat <<EOF > dist/README.md
          # Sociable Weaver Build Artifact

          This artifact contains the release build output produced by the CI pipeline.

          ## Contents

          - \`sw\`: release binary built with \`cargo build --release\`

          ## Build Metadata

          - OS: \`ubuntu-latest\`
          - Commit: \`${{ github.sha }}\`
          - Summary: \`${COMMIT_SUBJECT}\`
          - Workflow run: \`${{ github.run_id }}\`
          - Profile: \`release\`
          EOF

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: sw-ci-ubuntu-latest
          path: dist/

  release_build:
    name: Release Build (${{ matrix.label }})
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-musl
            asset_target: x86_64-unknown-linux-musl
          - os: macos-15
            label: macos-aarch64
            target: aarch64-apple-darwin
            asset_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install Linux musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }} --verbose

      - name: Prepare release asset bundle
        shell: bash
        run: |
          asset_name="sw-${GITHUB_REF_NAME}-${{ matrix.asset_target }}.tar.gz"
          mkdir -p release stage
          cp "target/${{ matrix.target }}/release/sw" stage/sw
          cp LICENSE README.md stage/
          tar -C stage -czf "release/${asset_name}" sw LICENSE README.md

      - name: Upload release asset bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: release/*.tar.gz

  release:
    name: Release
    needs: release_build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release asset bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Prepare official release README
        run: ./tools/render-release-readme.sh release/README.md
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Generate release checksums
        run: |
          cd release
          sha256sum sw-*.tar.gz > SHA256SUMS

      - name: Upload Homebrew formula inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-formula-inputs
          path: release/SHA256SUMS

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/sw-*.tar.gz
            release/SHA256SUMS
            release/README.md

  sync_homebrew_tap:
    name: Synchronize Homebrew Tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-tap-sync
      cancel-in-progress: false

    steps:
      - name: Require tap credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN must grant contents write access to albertattard/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Download release formula inputs
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: albertattard/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render Homebrew formula
        run: |
          ./tools/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" \
            release/SHA256SUMS \
            homebrew-tap/Formula/sw.rb

      - name: Commit formula update
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/sw.rb; then
            echo "Homebrew formula already matches $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sw.rb
          git commit -m "Update sw to $GITHUB_REF_NAME"
          git push origin HEAD:main
